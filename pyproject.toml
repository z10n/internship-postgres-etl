[build-system]
requires = ["setuptools >= 77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "internship-postgres-etl"
version = "0.1.0"
description = "ETL pipeline for students/rooms analytics"
requires-python = ">= 3.12"
dependencies = [
    "psycopg2-binary==2.9.9",
]

[tool.setuptools.packages.find]
include = ["src*", "config*"]